  <!-- ───── Portfolio hero: words on the left; on the right a slanted wall of three columns of photos.
       The columns drift on their own (first and third up, the middle one down), scrolling the page pushes them along,
       the wall leans a little towards the mouse, and pointing at it never stops it. Each photo opens its home.
       The homes, photos and words are M2D's own, taken from m2decor.com/portfolio. The page builder fills in the photos. ───── -->
  <section class="pfh" id="pfHero" aria-label="Our portfolio">
    <div class="pfh-words">
      <h1>Our <em>Portfolio.</em></h1>
      <p class="lede">Our carpentry goes into every M2D home.</p>
    </div>
    <div class="pfh-stage">
      <div class="pfh-wall" id="pfWall">
{{wall}}
      </div>
    </div>
  </section>

  <!-- ───── Every home, in a grid. The page builder fills it in from _parts/projects.json. ───── -->
  <section class="block" id="homes">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <p class="eyebrow">Portfolio</p>
          <h2>Step inside <em>our homes.</em></h2>
        </div>
      </div>
    </div>
    <div class="pgrid pjgrid bleed" id="pjGrid">
{{projects}}
    </div>
  </section>

    <div class="wrap">
      <div class="sec-head">
